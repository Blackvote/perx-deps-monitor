apiVersion: v2
name: perx
description: Perx Application
type: application
version: 0.1.0
appVersion: "1.0"

sources:
  - https://github.com/Blackvote/perx-deps-monitor

maintainers:
  - name: blackvote
    email: pbspec2@gmail.com

dependencies:
  - name: mongodb
    version: 18.1.16
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled

  - name: nats
    version: 2.12.2
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled

  - name: perx-deps-monitor
    alias: web
    version: "0.1.0"
    repository: "oci://ghcr.io/blackvote"