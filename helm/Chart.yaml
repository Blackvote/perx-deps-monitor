apiVersion: v2
name: perx
description: Perx Application
type: application
version: 0.1.0
appVersion: "1.0"

sources:
  - https://github.com/<org>/<repo>

maintainers:
  - name: <your-name>
    email: <your-email>

dependencies:
  - name: mongodb
    version: 18.1.16
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled

  - name: nats
    version: 2.12.2
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
