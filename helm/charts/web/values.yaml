replicaCount: 1
revisionHistoryLimit: 3
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30

rollingUpdate:
  maxSurge: "25%"
  maxUnavailable: "25%"

image:
  repository: immateo/perx-deps-monitor
  tag: "latest"
  pullPolicy: IfNotPresent
  digest: ""

imagePullSecrets: []

serviceAccountName: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  additionalPorts: []

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: null

env:
  MONGO_HOST: "perx-mongodb"
  MONGO_PORT: "27017"
  MONGO_DB: "perx"
  MONGO_USER: "perx"
  NATS_HOST: "perx-nats"
  NATS_PORT: "4222"
  NATS_USER: "perx"
  PORT: "8080"

existingSecrets:
  mongo: ""
  nats: ""

probes:
  livenessPath: /health
  readinessPath: /ready
  startupPath: /ready
  livenessInitialDelaySeconds: 5
  livenessPeriodSeconds: 10
  livenessTimeoutSeconds: 2
  livenessFailureThreshold: 3
  readinessInitialDelaySeconds: 2
  readinessPeriodSeconds: 5
  readinessTimeoutSeconds: 2
  readinessFailureThreshold: 3
  startupPeriodSeconds: 2
  startupTimeoutSeconds: 2
  startupFailureThreshold: 30

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfileType: RuntimeDefault
  fsGroup: null

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null

lifecycle:
  enabled: true
  preStopSleepSeconds: 5

topologySpread:
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}

deploymentAnnotations: {}
podAnnotations: {}

extraEnv: []

configChecksum:
  enabled: true

networkPolicy:
  enabled: false
  ingressNginxNamespace: ingress-nginx
