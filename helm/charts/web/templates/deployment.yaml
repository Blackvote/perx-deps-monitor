apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "web.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: {{ include "web.fullname" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds | default 600 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge | default "25%" | quote }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable | default "25%" | quote }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "web.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: {{ include "web.fullname" . }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "web.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ include "web.fullname" . }}
      annotations:
        {{- if .Values.configChecksum.enabled | default true }}
        checksum/values: {{ toJson .Values | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      {{- if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot | default true }}
        seccompProfile:
          type: {{ .Values.podSecurityContext.seccompProfileType | default "RuntimeDefault" }}
        {{- with .Values.podSecurityContext.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}

      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | default 1 }}
          topologyKey: {{ .Values.topologySpread.topologyKey | default "kubernetes.io/hostname" | quote }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" | quote }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "web.fullname" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: {{ include "web.fullname" . }}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "web.fullname" . }}
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: {{ include "web.fullname" . }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: web
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}

          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation | default false }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem | default true }}
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot | default true }}
            {{- with .Values.securityContext.runAsUser }}
            runAsUser: {{ . }}
            {{- end }}
            {{- with .Values.securityContext.runAsGroup }}
            runAsGroup: {{ . }}
            {{- end }}
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          {{- if .Values.lifecycle.enabled | default true }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep {{ .Values.lifecycle.preStopSleepSeconds | default 5 }}"]
          {{- end }}

          resources:
            {{- toYaml (.Values.resources | default dict) | nindent 12 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath | default "/health" | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.livenessPeriodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.livenessTimeoutSeconds | default 2 }}
            failureThreshold: {{ .Values.probes.livenessFailureThreshold | default 3 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath | default "/ready" | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelaySeconds | default 2 }}
            periodSeconds: {{ .Values.probes.readinessPeriodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.probes.readinessTimeoutSeconds | default 2 }}
            failureThreshold: {{ .Values.probes.readinessFailureThreshold | default 3 }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startupPath | default "/ready" | quote }}
              port: http
            periodSeconds: {{ .Values.probes.startupPeriodSeconds | default 2 }}
            timeoutSeconds: {{ .Values.probes.startupTimeoutSeconds | default 2 }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold | default 30 }}

          env:
            - name: MONGO_HOST
              value: {{ required "env.MONGO_HOST is required" .Values.env.MONGO_HOST | quote }}
            - name: MONGO_PORT
              value: {{ .Values.env.MONGO_PORT | default "27017" | quote }}
            - name: MONGO_DB
              value: {{ required "env.MONGO_DB is required" .Values.env.MONGO_DB | quote }}
            - name: MONGO_USER
              value: {{ required "env.MONGO_USER is required" .Values.env.MONGO_USER | quote }}

            - name: NATS_HOST
              value: {{ required "env.NATS_HOST is required" .Values.env.NATS_HOST | quote }}
            - name: NATS_PORT
              value: {{ .Values.env.NATS_PORT | default "4222" | quote }}
            - name: NATS_USER
              value: {{ required "env.NATS_USER is required" .Values.env.NATS_USER | quote }}

            - name: PORT
              value: {{ .Values.env.PORT | default (toString .Values.service.port) | quote }}

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecrets.mongo is required" .Values.existingSecrets.mongo | quote }}
                  key: mongodb-passwords

            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecrets.nats is required" .Values.existingSecrets.nats | quote }}
                  key: password

          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
